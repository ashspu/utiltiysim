<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Utilitysim · town atlas</title>
<style>
:root{font:14px/1.5 system-ui,sans-serif;color:#f4f1df;background:#9eaf79}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,select,a{font:inherit}button,select{color:inherit;background:#253c32eb;border:1px solid #bccbb557;border-radius:8px;padding:8px 12px;cursor:pointer}button:hover{background:#3d5e47}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #edc87c;outline-offset:3px}#map{width:100vw;height:100vh;display:block;touch-action:none;cursor:grab}#map:active{cursor:grabbing}header{position:fixed;top:18px;left:18px;display:flex;gap:12px;align-items:center;pointer-events:none;text-shadow:0 1px 4px #233825}header>*{pointer-events:auto}h1{font-size:21px;line-height:1.1;margin:2px 0;letter-spacing:-.5px}small{font-size:10px;letter-spacing:.12em}#tools{position:fixed;top:82px;left:18px;width:280px;max-height:calc(100vh - 150px);overflow:auto;padding:18px;background:#20372de8;backdrop-filter:blur(12px);border:1px solid #d6e3c32b;border-radius:12px}#tools[hidden]{display:none}label{display:block;margin:12px 0}select{width:100%}p{font-size:12px;color:#c9d6bf}.row{display:flex;gap:8px;margin:10px 0}.row>*{flex:1}#status{position:fixed;bottom:18px;left:18px;background:#253c32e0;border-radius:8px;padding:8px 12px;font-size:11px;max-width:70vw}#zoom{position:fixed;right:18px;bottom:18px;display:flex;gap:5px}a{color:#e1d59e}dialog{position:fixed;inset:auto auto 66px 18px;margin:0;border:1px solid #bccbb554;border-radius:12px;background:#20372df5;color:inherit;padding:20px;width:355px;max-width:calc(100vw - 36px);max-height:66vh;overflow:auto;box-shadow:0 10px 30px #233d3355}dialog h2{font-size:17px;line-height:1.3;margin:0 25px 16px 0}.close{position:absolute;top:6px;right:6px}dl{display:grid;grid-template-columns:95px 1fr;gap:7px;font-size:12px}dt{color:#adc1a6}dd{margin:0;overflow-wrap:anywhere}#scale{white-space:nowrap;position:fixed;bottom:65px;right:20px;font-size:10px;color:#fff;text-shadow:0 1px 3px #20372d;border-bottom:2px solid white;text-align:center}#fatal{position:fixed;inset:35% 15%;background:#283d31;padding:25px}body.bake header,body.bake aside,body.bake #status,body.bake #zoom,body.bake #scale{display:none}@media(max-width:600px){header{top:12px;left:12px}#tools{left:12px;top:75px;width:260px}h1{font-size:18px}#status{left:12px;bottom:12px;max-width:65vw;font-size:10px}#zoom{right:12px;bottom:12px}dialog{left:12px}}
</style>
<canvas id="map" tabindex="0" role="application" aria-label="Interactive utility town map. Drag to pan, scroll or use plus and minus to zoom. Select a property to inspect its account."></canvas>
<header><button id="menu" aria-label="Toggle map tools" aria-expanded="false">☰</button><div><small>UTILITYSIM / LIVING ATLAS</small><h1 id="name">Opening town…</h1></div></header>
<aside id="tools" hidden><small>EXPLORE THE TOWN</small><label>Appearance<select id="stage"><option value="art">Illustrated town</option><option value="geometry">Measured geometry</option></select></label><label><input id="boundaries" type="checkbox"> Property lines</label><label><input id="roads" type="checkbox"> Road alignment</label><label><input id="pools" type="checkbox"> Recorded pool outlines</label><label><input id="names" type="checkbox"> Street names</label><div class="row"><button id="whole">Whole town</button><button id="centre">Town centre</button></div><div class="row"><button id="neighbourhood">Neighbourhood</button><button id="industry">Industry</button></div><label>Inspect visible records<select id="visibleRecords" aria-label="Select a visible property or road"><option>Zoom in to list records</option></select></label><p>Keyboard: arrows pan, + / - zoom, Enter selects the centre. Every property and road is selectable. Zoom reveals measured vectors and generated architectural materials at native resolution.</p><p id="coverage"></p><a id="system" href="/">Open the utility system</a></aside>
<div id="status" role="status">Loading map tiles…</div><div id="scale"></div><div id="zoom"><button id="minus" aria-label="Zoom out">−</button><button id="plus" aria-label="Zoom in">+</button></div>
<dialog id="inspector"><button class="close" aria-label="Close selection">×</button><h2 id="title"></h2><div id="details"></div></dialog>
<script type="module" src="tiled-map.js"></script></html>
